// Let's Go Recomp for Android: libmain.so (the runtime) + libSDL3.so, built by app/CMakeLists.txt (needs
// tools/android/build_deps.sh first). No game code in here: liblasgame.so is built from the player's own game files by
// tools/android/build_game.sh and packed into a personal APK (-PlasGameLib=<dir with arm64-v8a/liblasgame.so>).
// (After LASRecomp-Android-Plus' android/, MIT.)
plugins {
    id 'com.android.application'
}

def sdl = file('../../build/android/SDL3/android-project/app/src/main/java')

android {
    namespace 'com.letsgorecomp.android'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.letsgorecomp.android'
        minSdk 30          // Android 11: AAudio, MAP_FIXED_NOREPLACE kernels
        targetSdk 36
        versionCode 1
        versionName 'android-dev'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                targets 'main', 'SDL3-shared'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'  // (16 KB page devices: SDL3 too)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug  // (personal builds only: the APK holds code made from the game)
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        debug {
            // the runtime is unusably slow at -O0: keep debug info but optimize
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            buildStagingDirectory file('../../build/android/cxx')
        }
    }

    sourceSets {
        main {
            java.srcDirs += [sdl]
            assets.srcDirs += ["$buildDir/generated/lg-assets"]
            // a personal build with the game code inside (tools/android/build_game.sh --apk)
            if (project.hasProperty('lasGameLib')) jniLibs.srcDirs += [project.property('lasGameLib')]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false  // (stored uncompressed and mapped directly from the APK)
        }
    }
}

// What the app ships besides code (runtime/paths.c android_resources): the start screen font and the icon
tasks.register('lgAssets', Sync) {  // (Sync: a file gone from the sources goes from the APK too)
    from('../../third_party/fonts/Baloo2/Baloo2-SemiBold.ttf')
    from('../../third_party/fonts/Baloo2/OFL.txt') { rename { 'Baloo2-OFL.txt' } }
    from('../../docs/icon/icon_1024.png') { rename { 'icon.png' } }
    into "$buildDir/generated/lg-assets"
}
preBuild.dependsOn lgAssets
